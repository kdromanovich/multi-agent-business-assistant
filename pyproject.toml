[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-business-assistant"
version = "0.1.0"
description = "LangGraph multi-agent reference backend with human approval and MCP tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "langgraph>=0.6,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "pydantic-settings>=2.10,<3",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep CI focused on stable Python correctness checks instead of Ruff's evolving defaults.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
